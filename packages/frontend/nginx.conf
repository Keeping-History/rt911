# COEP is what makes the page cross-origin isolated, which is what the Infinite
# Mac emulator needs for SharedArrayBuffer — but it also BLOCKS third-party
# iframes. Verified empirically: a YouTube embed fails with
# ERR_BLOCKED_BY_RESPONSE while COEP is set, and loads (200) the moment it is not.
#
# The emulator only runs on the desktop, served at `/`. CMS pages live at their
# own root-level slugs and must be able to embed video, so they are served
# without COEP and are simply not cross-origin isolated. Mirrors the middleware
# in vite.config.ts — change both together, or dev and production will disagree
# about whether embeds work.
#
# The regex matches a single path segment containing no dot: `/about`,
# `/credits`. It deliberately does not match `/` (the desktop — `[^/.]+`
# requires at least one character), nor any multi-segment or file-like path such
# as `/assets/index-abc123.js`. nginx omits an add_header whose value is empty,
# which is how the page branch ends up with no COEP header at all.
map $uri $rt911_coep {
    default        "credentialless";
    "~^/[^/.]+/?$" "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # COOP is kept everywhere: it constrains window.opener and does not affect
    # framing. Only COEP is relaxed, and only for CMS page routes.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy $rt911_coep always;

    # Hashed Vite assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached: it points at hashed asset filenames that
    # change every build, so a stale cached index.html 404s on its old bundle.
    # no-store keeps Cloudflare/browsers from holding onto it across deploys.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA: serve index.html for any client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
