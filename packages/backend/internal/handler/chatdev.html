<!doctype html>
<meta charset="utf-8">
<title>IM Buddies dev harness</title>
<style>
  body { font: 13px ui-monospace, monospace; margin: 0; display: grid;
         grid-template-columns: 220px 1fr; height: 100vh; }
  #side { border-right: 1px solid #ccc; padding: 8px; overflow: auto; }
  #main { display: flex; flex-direction: column; }
  #ctl { padding: 8px; border-bottom: 1px solid #ccc; }
  #convo { flex: 1; overflow: auto; padding: 8px; }
  #log { height: 30%; overflow: auto; padding: 8px; white-space: pre-wrap;
         border-top: 1px solid #ccc; background: #fafafa; color: #555; }
  #compose { padding: 8px; border-top: 1px solid #ccc; display: flex; gap: 6px; }
  #body { flex: 1; }
  .off { color: #999; }
  .bad { color: #b00; }
  #roster div { cursor: pointer; padding: 2px 4px; }
  #roster div.sel { background: #000; color: #fff; }
  .msg { margin: 3px 0; }
  .msg .who { font-weight: bold; }
  .out .who { color: #06c; }
  .in .who { color: #333; }
  .typing { color: #999; font-style: italic; }
  .sys { color: #b00; }
</style>
<div id="side"><b>Buddies</b><div id="roster">(not subscribed)</div>
  <p style="color:#999">click a buddy to talk to them</p></div>
<div id="main">
  <div id="ctl">
    <label>clock <input id="clock" size="24" value="2001-09-11T13:00:00Z"></label>
    <button id="seek">seek</button>
    <button id="pause">pause</button>
    <button id="resume">resume</button>
    <button id="sub">subscribe chat</button>
    <span id="state" class="bad">state: —</span>
  </div>
  <div id="convo"></div>
  <div id="compose">
    <span id="to">(no buddy selected)</span>
    <input id="body" placeholder="pick a buddy on the left, then type here" disabled>
    <button id="send" disabled>send</button>
    <button id="hist" disabled>history</button>
  </div>
  <div id="log"></div>
</div>
<script>
// Minimal msgpack decoder. The server→client wire is binary, so JSON.parse
// shows nothing. Inlined rather than pulled from a CDN: no network dependency
// for a local dev tool, and no third-party script in the page. Extension types
// (time.Time) decode to null — the chat frames carry no time.Time fields, and
// the frames that do are filtered out of the log below.
function mp(buf) {
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const td = new TextDecoder();
  let i = 0;
  const str = (n) => {
    const s = td.decode(new Uint8Array(buf.buffer, buf.byteOffset + i, n));
    i += n;
    return s;
  };
  const arr = (n) => { const a = []; for (let k = 0; k < n; k++) a.push(rd()); return a; };
  const map = (n) => { const o = {}; for (let k = 0; k < n; k++) { const key = rd(); o[key] = rd(); } return o; };
  function rd() {
    const b = dv.getUint8(i++);
    if (b <= 0x7f) return b;
    if (b >= 0xe0) return b - 256;
    if (b <= 0x8f) return map(b & 0x0f);
    if (b <= 0x9f) return arr(b & 0x0f);
    if (b <= 0xbf) return str(b & 0x1f);
    switch (b) {
      case 0xc0: return null;
      case 0xc2: return false;
      case 0xc3: return true;
      case 0xca: { const v = dv.getFloat32(i); i += 4; return v; }
      case 0xcb: { const v = dv.getFloat64(i); i += 8; return v; }
      case 0xcc: return dv.getUint8(i++);
      case 0xcd: { const v = dv.getUint16(i); i += 2; return v; }
      case 0xce: { const v = dv.getUint32(i); i += 4; return v; }
      case 0xcf: { const v = Number(dv.getBigUint64(i)); i += 8; return v; }
      case 0xd0: return dv.getInt8(i++);
      case 0xd1: { const v = dv.getInt16(i); i += 2; return v; }
      case 0xd2: { const v = dv.getInt32(i); i += 4; return v; }
      case 0xd3: { const v = Number(dv.getBigInt64(i)); i += 8; return v; }
      case 0xd9: return str(dv.getUint8(i++));
      case 0xda: { const n = dv.getUint16(i); i += 2; return str(n); }
      case 0xdb: { const n = dv.getUint32(i); i += 4; return str(n); }
      case 0xdc: { const n = dv.getUint16(i); i += 2; return arr(n); }
      case 0xdd: { const n = dv.getUint32(i); i += 4; return arr(n); }
      case 0xde: { const n = dv.getUint16(i); i += 2; return map(n); }
      case 0xdf: { const n = dv.getUint32(i); i += 4; return map(n); }
      case 0xc4: { const n = dv.getUint8(i++); i += n; return null; }
      case 0xc5: { const n = dv.getUint16(i); i += 2 + n; return null; }
      case 0xc6: { const n = dv.getUint32(i); i += 4 + n; return null; }
      case 0xc7: { const n = dv.getUint8(i++); i += 1 + n; return null; }
      case 0xc8: { const n = dv.getUint16(i); i += 3 + n; return null; }
      case 0xc9: { const n = dv.getUint32(i); i += 5 + n; return null; }
      case 0xd4: i += 2; return null;
      case 0xd5: i += 3; return null;
      case 0xd6: i += 5; return null;
      case 0xd7: i += 9; return null;
      case 0xd8: i += 17; return null;
    }
    throw new Error("unsupported msgpack byte 0x" + b.toString(16));
  }
  return rd();
}

const url = new URL(location.href);
const ws = new WebSocket((url.protocol === "https:" ? "wss://" : "ws://") + url.host + "/stream");
ws.binaryType = "arraybuffer";

const log = (s) => {
  const el = document.getElementById("log");
  el.textContent += s + "\n";
  el.scrollTop = el.scrollHeight;
};
const send = (o) => { ws.send(JSON.stringify(o)); log("→ " + JSON.stringify(o)); };

ws.onopen = () => {
  log("connected");
  send({ type: "init", time: document.getElementById("clock").value });
};

ws.onmessage = (ev) => {
  const msg = mp(new Uint8Array(ev.data));
  if (msg.type === "chat_state") {
    const el = document.getElementById("state");
    el.textContent = "state: " + (msg.enabled ? "enabled" : "disabled (" + msg.reason + ")");
    el.className = msg.enabled ? "" : "bad";
  }
  if (msg.type === "chat_roster") {
    // `buddies` is omitted entirely (not sent as null/[]) when the roster is
    // empty — outMsg.Buddies rides omitempty since it's shared with the 1 Hz
    // items hot path. Treat an absent field as an empty list.
    const buddies = msg.buddies || [];
    const roster = document.getElementById("roster");
    roster.textContent = "";
    for (const b of buddies) {
      const row = document.createElement("div");
      row.className = b.online ? "" : "off";
      row.dataset.id = b.id;
      row.dataset.name = b.screen_name;
      row.textContent = b.screen_name;
      // Selecting a buddy is what enables the compose box: chat_send carries a
      // profile id, so there is no meaningful "send" without one.
      row.onclick = () => selectBuddy(b.id, b.screen_name);
      roster.appendChild(row);
    }
    if (selected.id) markSelected();
  }
  if (msg.type === "chat_typing") {
    showTyping(msg.profile);
  }
  if (msg.type === "chat_message") {
    clearTyping();
    // direction is from the STUDENT's point of view: "in" is what they typed,
    // "out" is the buddy replying.
    const who = msg.direction === "out" ? nameFor(msg.profile) : "you";
    addMsg(who, msg.body, msg.direction === "out" ? "out" : "in", msg.kind);
  }
  if (msg.type === "chat_error") {
    addSys("error: " + (msg.code || "") + " " + (msg.message || ""));
  }
  if (msg.type === "chat_presence") {
    const row = document.querySelector(`#roster [data-id="${msg.profile}"]`);
    if (row) row.className = msg.online ? "" : "off";
  }
  // Allowlist chat frames rather than blocklisting noisy ones. The init reply
  // carries the whole SourceList, which includes every Usenet newsgroup in the
  // archive — thousands of entries that bury the chat traffic this harness
  // exists to show. A blocklist would also need extending every time a channel
  // is added, and would be silently wrong until someone noticed the flood.
  if (msg.type.startsWith("chat_")) {
    log("← " + JSON.stringify(msg));
  } else if (msg.type !== "items" && msg.type !== "heartbeat_ack") {
    log("← " + msg.type + " " + summarize(msg));
  }
};

// One line per non-chat frame: enough to see the connection working, without
// pasting a payload nobody is reading.
function summarize(msg) {
  const parts = [];
  for (const [k, v] of Object.entries(msg)) {
    if (k === "type") continue;
    if (Array.isArray(v)) parts.push(`${k}[${v.length}]`);
    else if (v && typeof v === "object") {
      const n = Object.values(v).reduce((a, x) => a + (Array.isArray(x) ? x.length : 1), 0);
      parts.push(`${k}{${n}}`);
    } else {
      const s = String(v);
      parts.push(`${k}=${s.length > 40 ? s.slice(0, 40) + "…" : s}`);
    }
  }
  return parts.join(" ");
}

ws.onclose = () => log("disconnected");

// ---- conversation ----

const selected = { id: 0, name: "" };
const convo = document.getElementById("convo");
const bodyEl = document.getElementById("body");

function nameFor(id) {
  const row = document.querySelector(`#roster [data-id="${id}"]`);
  return row ? row.dataset.name : "buddy " + id;
}

function markSelected() {
  for (const r of document.querySelectorAll("#roster div")) {
    r.classList.toggle("sel", Number(r.dataset.id) === selected.id);
  }
}

function selectBuddy(id, name) {
  selected.id = id;
  selected.name = name;
  markSelected();
  document.getElementById("to").textContent = "to " + name + ":";
  for (const el of ["body", "send", "hist"]) document.getElementById(el).disabled = false;
  bodyEl.placeholder = "message " + name + " and press enter";
  bodyEl.focus();
}

function addMsg(who, text, cls, kind) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  const k = kind && kind !== "typed" && kind !== "generated" ? ` [${kind}]` : "";
  d.innerHTML = `<span class="who"></span> <span class="txt"></span><span class="k"></span>`;
  d.querySelector(".who").textContent = who + ":";
  d.querySelector(".txt").textContent = text;
  d.querySelector(".k").textContent = k;
  convo.appendChild(d);
  convo.scrollTop = convo.scrollHeight;
}

function addSys(text) {
  const d = document.createElement("div");
  d.className = "msg sys";
  d.textContent = text;
  convo.appendChild(d);
  convo.scrollTop = convo.scrollHeight;
}

let typingEl = null;
function showTyping(profile) {
  clearTyping();
  typingEl = document.createElement("div");
  typingEl.className = "typing";
  typingEl.textContent = nameFor(profile) + " is typing…";
  convo.appendChild(typingEl);
  convo.scrollTop = convo.scrollHeight;
}
function clearTyping() {
  if (typingEl) typingEl.remove();
  typingEl = null;
}

function sendChat() {
  const text = bodyEl.value.trim();
  if (!text || !selected.id) return;
  // The server echoes nothing for the inbound message, so render it locally.
  // A chat_message with direction "in" only arrives when replaying history.
  addMsg("you", text, "in");
  send({ type: "chat_send", profile: selected.id, body: text });
  bodyEl.value = "";
}

document.getElementById("send").onclick = sendChat;
bodyEl.onkeydown = (e) => { if (e.key === "Enter") sendChat(); };
document.getElementById("hist").onclick = () => {
  convo.textContent = "";
  send({ type: "chat_history", profile: selected.id, before: document.getElementById("clock").value, limit: 40 });
};

document.getElementById("seek").onclick = () =>
  send({ type: "seek", time: document.getElementById("clock").value });
document.getElementById("pause").onclick = () => send({ type: "pause" });
document.getElementById("resume").onclick = () => send({ type: "resume" });
document.getElementById("sub").onclick = () => send({ type: "subscribe", channel: "chat" });
</script>
