[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-grabber"
version = "0.1.0"
description = "IA broadcast archive → HLS pipeline for 9/11 TV recordings"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
"httpx>=0.27",
    "boto3>=1.36",
    "tenacity>=8.2",
    "prefect>=3.0",
    # fastapi<0.137 was required for Prefect 3.7.4 (PrefectRouter compat bug).
    # Prefect 3.7.6 fixed it; <0.139 verified green via dependabot PR #132.
    "fastapi<0.140",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3]>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's *default* selection grows between
# releases, and the dev extra floors ruff at >=0.4 with no ceiling, so CI
# installs whatever is newest — 0.16.0 expanded the defaults and lit up 252
# pre-existing style findings in files nobody had touched, failing a build for
# reasons unrelated to the change that triggered it.
#
# These four are what this project has effectively linted against all along.
# Adopting the newer rules (UP017 datetime.UTC, I001 import sorting, UP007/UP045
# annotation syntax) is a worthwhile cleanup, but it is a ~250-line sweep that
# belongs in its own change, not riding along in whatever lands next.
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 100
target-version = ["py312"]
