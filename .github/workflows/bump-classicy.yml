name: Bump classicy

# Pull the latest Classicy release into pnpm-lock.yaml (and
# packages/frontend/package.json's version ranges) and, if it actually changed,
# land it on `main` so the deployed frontend picks it up.
#
# Classicy 3 ships as three npm packages released together at the same version:
# the core, `@classicy/classicy` (the unscoped `classicy` package stopped at
# 2.x), and the two looks this app loads, `@classicy/appearance-platinum` and
# `@classicy/appearance-system7`, whose peer ranges are `^<core version>`.
# npm publishes them one after another and its metadata lags, so the "Wait for
# npm" step below polls until all three serve the target version before
# `pnpm bump:classicy` updates them in one command, and the "Check lockstep"
# step refuses a bump that leaves any of them (installed version or written
# range) on a different version.
#
# Why this exists: `.husky/pre-commit` auto-bumps Classicy on every human
# commit — but between commits a fresh Classicy release won't reach production
# on its own. This workflow is the button (manual or fired by classicy's
# publish) that forces that refresh.
# Because build.yml installs with `--frozen-lockfile`, the bump MUST be
# committed to the lockfile on `main` — "just rebuild" would reinstall the old
# version.
#
# Why a PR + auto-merge instead of a direct push: `main` requires the
# `streamer`, `frontend`, `frontend-typecheck`, `frontend-lint`,
# `frontend-test` and `e2e` status checks. `github-actions[bot]` is not a repo
# admin, so a direct push of a fresh commit is rejected (GH006 — "required
# status checks are expected"). Instead we open a PR *as the RT911_DISPATCH
# GitHub App* and enable auto-merge: the App identity (unlike GITHUB_TOKEN) fires
# the PR's checks, and once they go green GitHub squash-merges automatically. The
# merge commit — also App-authored — then fires build.yml's `push:` trigger, so
# no separate `gh workflow run` is needed.
#
# Prerequisites (one-time, outside this repo):
#   - Secrets RT911_DISPATCH_APP_ID / RT911_DISPATCH_APP_PRIVATE_KEY added to this
#     repo (the same App classicy already uses to dispatch here).
#   - That App's installation on Keeping-History/rt911 granted BOTH
#     "Contents: write" AND "Pull requests: write".
#   - Repo setting "Allow auto-merge" enabled (it is).

on:
  workflow_dispatch:
  # Fired by the classicy repo's Release Package workflow after it publishes a
  # new version to npm (see classicy/.github/workflows/push.yml). client_payload
  # carries the new version tag for logging / the PR title.
  repository_dispatch:
    types: [classicy-published]

# The App installation token minted below carries the write permissions; the
# built-in GITHUB_TOKEN only needs to read during checkout/install.
permissions:
  contents: read

concurrency:
  group: bump-classicy
  cancel-in-progress: false

env:
  # Don't let .husky/pre-commit re-run the classicy update inside our commit.
  HUSKY: "0"
  BRANCH: chore/bump-classicy

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # Short-lived, repo-scoped token from the "classicy dispatch" GitHub App.
      # Authoring the branch push + PR as the App (not GITHUB_TOKEN) is what lets
      # the PR trigger the required status checks — GITHUB_TOKEN would not.
      - name: Mint bump token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RT911_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RT911_DISPATCH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Wire the App token into the origin remote so `git push` is App-authored.
          token: ${{ steps.token.outputs.token }}

      - uses: jdx/mise-action@v5
        # Provisions node/pnpm from mise.toml, matching build.yml.

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Show trigger
        env:
          # Empty on manual runs; set to the published tag on repository_dispatch.
          TAG: ${{ github.event.client_payload.tag }}
        run: echo "::notice::Triggered by ${{ github.event_name }}${TAG:+ for classicy $TAG}"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install

      - name: Wait for npm to serve one version for all three packages
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          # The three packages publish seconds apart and npm's metadata lags, so
          # a dispatch can arrive while one is still missing. `pnpm bump:classicy`
          # uses `--latest`, so the real requirement is that the three
          # `dist-tags.latest` values agree (a newer release may already be
          # latest by the time an older dispatch runs, which is fine). When a
          # tag was dispatched (e.g. v3.7.0), every package must also serve that
          # version. Up to 10 minutes: 30 attempts, 20 s apart (overridable for
          # local tests).
          WAIT_ATTEMPTS="${WAIT_ATTEMPTS:-30}"
          WAIT_INTERVAL="${WAIT_INTERVAL:-20}"
          pkgs="@classicy/classicy @classicy/appearance-platinum @classicy/appearance-system7"
          target="${TAG#v}"
          detail=""
          for attempt in $(seq 1 "$WAIT_ATTEMPTS"); do
            detail=""
            common=""
            agree=1
            served=1
            for pkg in $pkgs; do
              latest=$(npm view --prefer-online "$pkg" dist-tags.latest 2>/dev/null || true)
              if [ -n "$target" ]; then
                have=$(npm view --prefer-online "$pkg@$target" version 2>/dev/null || true)
                if [ "$have" = "$target" ]; then serves="serves $target"; else serves="does not serve $target (not published yet, or npm unreachable)"; served=0; fi
              else
                serves="no target (manual run)"
              fi
              detail="${detail:+$detail; }$pkg: latest '${latest:-none}', $serves"
              if [ -z "$latest" ]; then agree=0; fi
              if [ -z "$common" ]; then common="$latest"; elif [ "$latest" != "$common" ]; then agree=0; fi
            done
            if [ "$agree" = 1 ] && [ "$served" = 1 ]; then
              echo "::notice::All three Classicy packages have latest $common${target:+ and serve $target}; the bump PR will carry $common (attempt $attempt)"
              exit 0
            fi
            echo "::notice::Attempt $attempt/$WAIT_ATTEMPTS: waiting for one common latest${target:+ that serves $target}; $detail"
            if [ "$attempt" -lt "$WAIT_ATTEMPTS" ]; then sleep "$WAIT_INTERVAL"; fi
          done
          echo "::error::Timed out waiting for npm to serve one common latest${target:+ that serves $target} for all three Classicy packages; $detail"
          exit 1

      - name: Update Classicy (@classicy/classicy, @classicy/appearance-platinum and @classicy/appearance-system7)
        run: pnpm bump:classicy

      - name: Check lockstep
        working-directory: packages/frontend
        run: |
          # All three packages publish at the same version from one release.
          # Compare what is installed and what `--latest` wrote to package.json;
          # if any differ, do not open a PR whose peer ranges miss their core.
          out=$(node -e '
            const names = ["@classicy/classicy", "@classicy/appearance-platinum", "@classicy/appearance-system7"];
            const pkg = require("./package.json");
            const rows = names.map((n) => ({
              n,
              installed: require("./node_modules/" + n + "/package.json").version,
              range: (pkg.dependencies?.[n] ?? pkg.devDependencies?.[n] ?? "missing").replace(/^[\^~]/, ""),
            }));
            for (const r of rows) console.log(`${r.n}: installed ${r.installed}, range ${r.range}`);
            const all = new Set(rows.flatMap((r) => [r.installed, r.range]));
            process.exit(all.size === 1 ? 0 : 1);
          ') && ok=1 || ok=0
          echo "$out" | while IFS= read -r line; do echo "::notice::$line"; done
          if [ "$ok" != 1 ]; then
            echo "::error::The three Classicy packages are not in lockstep (installed versions and package.json ranges must all match); not opening a bump PR. $(echo "$out" | tr '\n' ';')"
            exit 1
          fi

      - name: Open bump PR and enable auto-merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          # `pnpm update --latest` rewrites packages/frontend/package.json's
          # ranges for all three packages in addition to the lockfile — check (and
          # stage) both files, or the bump PR would leave package.json stale
          # and the next non-frozen `pnpm install` would revert it.
          if git diff --quiet -- pnpm-lock.yaml packages/frontend/package.json; then
            echo "::notice::Classicy already up to date — no PR needed"
            exit 0
          fi

          title="chore: bump classicy${TAG:+ to $TAG}"

          # Roll a single, always-current bump branch. Force-push so a stacked-up
          # release supersedes an in-flight one instead of piling up stale PRs.
          git checkout -B "$BRANCH"
          git add pnpm-lock.yaml packages/frontend/package.json
          git commit -m "$title"
          git push --force --set-upstream origin "$BRANCH"

          # Reuse the branch's PR only if one is actually OPEN, and address it by
          # number from here on. Resolving a PR by branch name is ambiguous:
          # neither `gh pr view` nor `gh pr merge` filters by state, so both
          # happily match a long-since-merged PR on this recycled branch name.
          # That is how the v0.70.1 bump stalled — #313 ("bump classicy to
          # v0.57.2") answered the guard, `gh pr create` was skipped, auto-merge
          # was armed on a closed PR, and the bump commit sat on the branch with
          # no PR while main stayed on the broken release.
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create \
              --base main --head "$BRANCH" \
              --title "$title" \
              --body "Automated Classicy bump: \`@classicy/classicy\`, \`@classicy/appearance-platinum\` and \`@classicy/appearance-system7\`, together.${TAG:+ New version: \`$TAG\`.}")
          fi

          # Merge once the required checks pass; delete the branch afterwards.
          gh pr merge "$pr" --auto --squash --delete-branch
          echo "::notice::Bump PR $pr opened for $BRANCH — auto-merge armed"
