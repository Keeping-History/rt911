packages:
  - "packages/*"
# Repo-local package store, so a checkout is self-contained and `rm -rf` on it
# takes the store with it. Lived in .pnpmrc until pnpm 11 moved settings here
# alongside overrides/onlyBuiltDependencies; keeping one config home means no
# rc-file precedence to reason about. Relative to this file, i.e. the workspace
# root, whatever directory pnpm is invoked from.
storeDir: .pnpm-store
# Installs resolve fresh rather than trusting the lockfile — the husky
# pre-commit hook bumps `classicy` on every commit, so the lockfile is
# routinely one step behind package.json by design. CI passes
# --frozen-lockfile explicitly and is unaffected.
preferFrozenLockfile: false
onlyBuiltDependencies:
  - es5-ext
  - esbuild
overrides:
  brace-expansion: '>=5.0.9'
  immutable: '>=5.1.8'
  undici: '>=7.28.0 <8'
  js-yaml: '>=4.2.0 <5'
  esbuild: '>=0.28.1'
  '@babel/core': '>=7.29.6 <8'
# pnpm 11 refuses any package published within minimumReleaseAge (24h by
# default) — a supply-chain delay that is worth keeping. Two exemptions:
#
# classicy is pinned to "latest" and .husky/pre-commit bumps it on EVERY
# commit, so a same-day publish would fail the hook for everyone until it
# aged out. Excluding it is the difference between the gate protecting the
# tree and the gate blocking it.
#
# oxlint is exempt because it publishes 20 per-platform binding packages in
# lockstep; without this, a lint upgrade lands as 20 hand-maintained
# version-pinned exclusions that go stale the moment the version moves.
minimumReleaseAgeExclude:
  - classicy
  - oxlint
  - '@oxlint/*'
